<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <title>Apply for Position</title>
    <link rel="stylesheet" th:href="@{/css/style.css}" />
  </head>
  <body>
    <div class="container">
      <h1>Submit Application</h1>
      <form th:action="@{/applicant/apply}" th:object="${form}" method="post">
        <h3>Areas of Expertise</h3>
        <div class="section-card">
          <div th:each="comp, iter : *{competences}" class="flex-row">
            <select
              th:field="*{competences[__${iter.index}__].competenceId}"
              style="flex: 2"
            >
              <option value="">-- Select Competence --</option>
              <option
                th:each="c : ${allCompetences}"
                th:value="${c.competenceId}"
                th:text="${c.name}"
              ></option>
            </select>
            <input
              type="number"
              step="0.1"
              th:field="*{competences[__${iter.index}__].years}"
              placeholder="Years"
              style="flex: 1"
            />
          </div>
        </div>

        <h3>Availability Periods</h3>
        <div class="section-card">
          <div th:each="avail, iter : *{availabilities}" class="flex-row">
            <label>From:</label>
            <input
              type="date"
              th:field="*{availabilities[__${iter.index}__].fromDate}"
            />
            <label>To:</label>
            <input
              type="date"
              th:field="*{availabilities[__${iter.index}__].toDate}"
            />
          </div>
        </div>

        <div class="space-between mt-30">
          <a href="/home" class="btn-secondary" style="text-decoration: none"
            >Cancel</a
          >
          <button type="submit" class="btn">Submit Application</button>
        </div>
      </form>
    </div>
  </body>
</html>
