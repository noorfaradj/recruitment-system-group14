<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Recruitment - Applications</title>
    <link rel="stylesheet" th:href="@{/css/style.css}" />
  </head>
  <body>
    <div class="container container-wide">
      <h1>Job Applications List</h1>
      <table>
        <thead>
          <tr>
            <th>ID</th>
            <th>Applicant</th>
            <th>Email</th>
            <th>Status</th>
          </tr>
        </thead>
        <tbody>
          <tr th:each="app : ${applications}">
            <td th:text="${app.id}">1</td>
            <td th:text="${app.fullName}">First Last</td>
            <td th:text="${app.email}">email@test.com</td>
            <td class="status-col" th:text="${app.status}">UNHANDLED</td>
          </tr>
        </tbody>
      </table>
      <div class="mt-30">
        <a href="/home" class="btn-secondary" style="text-decoration: none"
          >← Back to Dashboard</a
        >
      </div>
    </div>
  </body>
</html>
