<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <title>Register Account</title>
    <link rel="stylesheet" th:href="@{/css/style.css}" />
  </head>
  <body>
    <div class="container">
      <h1>Create Account</h1>
      <div
        th:if="${regError}"
        class="error-msg text-center"
        style="margin-bottom: 20px"
      >
        <p th:text="${regError}"></p>
      </div>
      <p style="margin-bottom: 2rem">
        Please fill in your details to register.
      </p>

      <form th:action="@{/register}" th:object="${user}" method="post">
        <div class="form-group">
          <label>Username</label>
          <input
            type="text"
            th:field="*{username}"
            th:classappend="${#fields.hasErrors('username')} ? 'is-invalid'"
          />
          <p
            class="error-msg"
            th:if="${#fields.hasErrors('username')}"
            th:errors="*{username}"
          ></p>
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px">
          <div class="form-group">
            <label>First Name</label>
            <input
              type="text"
              th:field="*{name}"
              th:classappend="${#fields.hasErrors('name')} ? 'is-invalid'"
            />
            <p
              class="error-msg"
              th:if="${#fields.hasErrors('name')}"
              th:errors="*{name}"
            ></p>
          </div>
          <div class="form-group">
            <label>Last Name</label>
            <input
              type="text"
              th:field="*{surname}"
              th:classappend="${#fields.hasErrors('surname')} ? 'is-invalid'"
            />
            <p
              class="error-msg"
              th:if="${#fields.hasErrors('surname')}"
              th:errors="*{surname}"
            ></p>
          </div>
        </div>

        <div class="form-group">
          <label>Email</label>
          <input
            type="email"
            th:field="*{email}"
            th:classappend="${#fields.hasErrors('email')} ? 'is-invalid'"
          />
          <p
            class="error-msg"
            th:if="${#fields.hasErrors('email')}"
            th:errors="*{email}"
          ></p>
        </div>

        <div class="form-group">
          <label>Person Number (PNR)</label>
          <input
            type="text"
            th:field="*{pnr}"
            th:classappend="${#fields.hasErrors('pnr')} ? 'is-invalid'"
          />
          <p
            class="error-msg"
            th:if="${#fields.hasErrors('pnr')}"
            th:errors="*{pnr}"
          ></p>
        </div>

        <div class="form-group">
          <label>Password</label>
          <input
            type="password"
            th:field="*{password}"
            th:classappend="${#fields.hasErrors('password')} ? 'is-invalid'"
          />
          <p
            class="error-msg"
            th:if="${#fields.hasErrors('password')}"
            th:errors="*{password}"
          ></p>
        </div>

        <button type="submit" class="btn" style="width: 100%; margin-top: 10px">
          Register
        </button>
      </form>

      <p style="text-align: center; margin-top: 20px">
        Already have an account?
        <a href="/login" style="color: #d81b60; font-weight: bold"
          >Log in here</a
        >
      </p>
    </div>
  </body>
</html>
