<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <title>Error - Recruitment System</title>
    <link rel="stylesheet" th:href="@{/css/style.css}" />
  </head>
  <body>
    <div class="container">
      <header>
        <h1 th:text="${errorTitle != null ? errorTitle : 'Unexpected Error'}">
          Error
        </h1>
      </header>
      <main>
        <div class="error-box">
          <p
            class="status-code"
            th:if="${status}"
            th:text="'Status: ' + ${status}"
          ></p>
          <p
            th:text="${errorMessage != null ? errorMessage : 'An unknown error has occurred.'}"
          >
            Error message here.
          </p>
          <br />
          <a href="/" class="btn">Return to Start</a>
        </div>
      </main>
    </div>
  </body>
</html>
